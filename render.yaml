# Render blueprint: API + Postgres.
# Deploy with Render → New → Blueprint, pointed at this repository.
#
# The service MUST be named `apsl-api`, because frontend/vercel.json proxies
# /api and /uploads to https://apsl-api.onrender.com.
services:
  - type: web
    name: apsl-api
    runtime: node
    plan: free
    rootDir: backend
    # Migrations are idempotent; the seed upserts categories and the admin
    # account and skips products once the table has rows.
    buildCommand: npm install && npm run migrate && npm run seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: apsl-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true          # Render generates a long random value
      - key: COOKIE_SECURE
        value: "true"                # Render serves over HTTPS
      - key: CORS_ORIGIN
        value: ""                    # not needed: Vercel proxies same-origin
      - key: ADMIN_EMAIL
        sync: false                  # set in the Render dashboard
      - key: ADMIN_PASSWORD
        sync: false                  # set in the Render dashboard

databases:
  - name: apsl-db
    plan: free
    databaseName: apsl
    user: apsl
